# A metapackage: pytest's plugin list only includes PyPI projects named pytest-*.
# The plugin itself ships in numguard-ci (entry point `pytest11: numguard`);
# this package only depends on it, so the plugin is registered exactly once.
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pytest-numguard"
version = "1.0.1"
description = "pytest plugin for numerical edge-case testing: NaN, inf, overflow, cancellation and dtype bugs in array code (installs numguard-ci)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bhaskar Gurram", email = "gurrambhaskar.ai@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numguard-ci>=1.0.1,<2", "pytest>=8.0"]
keywords = ["pytest", "numpy", "floating-point", "numerical", "edge cases", "testing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/bhaskargurram-ai/numguard"
Documentation = "https://github.com/bhaskargurram-ai/numguard#readme"
Changelog = "https://github.com/bhaskargurram-ai/numguard/blob/main/CHANGELOG.md"
Issues = "https://github.com/bhaskargurram-ai/numguard/issues"

[tool.setuptools]
py-modules = []
