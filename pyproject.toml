[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "numguard-ci"
version = "1.0.0"
description = "Numerical edge-case testing for array code: catch the NaNs, overflows and precision bugs that happy-path tests miss, in pytest and CI, with an optional agent whose fixes are verified by execution."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bhaskar Gurram", email = "gurrambhaskar.ai@gmail.com" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "click>=8.0",
    "tomli>=1.1; python_version < '3.11'",
]
keywords = ["numpy", "testing", "numerical", "floating-point", "edge cases", "pytest", "ulp", "hypothesis",
            "github-actions", "llm"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
pytest = ["pytest>=8.0"]
mpmath = ["mpmath>=1.3"]
scipy = ["scipy>=1.10"]
hypothesis = ["hypothesis>=6.0"]
bfloat16 = ["ml_dtypes>=0.3"]
dev = ["pytest>=8.0", "scipy>=1.10", "mpmath>=1.3", "hypothesis>=6.0", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/bhaskargurram-ai/numguard"
Documentation = "https://github.com/bhaskargurram-ai/numguard#readme"
Changelog = "https://github.com/bhaskargurram-ai/numguard/blob/main/CHANGELOG.md"
Issues = "https://github.com/bhaskargurram-ai/numguard/issues"

[project.scripts]
numguard = "numguard.cli:main"

[project.entry-points.pytest11]
numguard = "numguard.pytest_plugin"

[tool.setuptools]
package-dir = { "" = "src", "numguard._corpus" = "corpus" }
# corpus task folders are data, shipped as (namespace-free) subpackages of numguard._corpus
packages = [
    "numguard",
    "numguard.agent",
    "numguard._corpus",
    "numguard._corpus.cosine_similarity",
    "numguard._corpus.hypot",
    "numguard._corpus.log1p",
    "numguard._corpus.logsumexp",
    "numguard._corpus.loo_mean",
    "numguard._corpus.mean_float16",
    "numguard._corpus.normalize",
    "numguard._corpus.quantize_dynamic",
    "numguard._corpus.sample_std",
    "numguard._corpus.sigmoid",
    "numguard._corpus.softmax",
    "numguard._corpus.variance_onepass",
]

[tool.setuptools.package-data]
"numguard._corpus" = ["*/task.md"]
"numguard" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
