# numguard, part 1 of 2: run the checks (UNPRIVILEGED).
#
# Dogfooding caller for the numguard repository itself: it calls the local
# reusable workflow and installs numguard from the pull request's own head
# commit, so every PR is checked by the version of numguard it contains,
# against the targets in numguard.toml (the bug corpus' reference
# implementations). Other repositories should run `numguard init` or copy
# examples/workflows/numguard.yml, which pin a release instead.
#
# Because the tool comes from the PR, a PR can change how its own card is
# produced. That is acceptable only because this job is unprivileged
# (read-only token, no secrets); the privileged comment workflow installs
# numguard from the default branch and warns on the card when a PR touches
# workflows, numguard.toml or the test harness.
name: numguard

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: numguard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    uses: ./.github/workflows/check.yml
    with:
      numguard-repository: ${{ github.repository }}
      numguard-ref: ${{ github.event.pull_request.head.sha }}
      install-command: python -m pip install -e ".[dev]"
      fail-on: fail
