# numguard reusable workflow: post the card (PRIVILEGED zone).
#
# Call it from a workflow triggered by `workflow_run` of the check workflow
# (see `numguard init` or examples/workflows/numguard-comment.yml), and from
# the agent workflow after its verify job.
#
# This job holds a token that can write PR comments and labels, so it NEVER
# checks out, installs, builds or executes anything from the pull request.
# It only:
#   1. installs numguard from its own repository at `numguard-ref`, into an
#      isolated virtualenv;
#   2. downloads the `numguard-result` artifact (produced next to PR code, so
#      treated as hostile);
#   3. validates the PR number, the result.json schema, and that the result
#      and the PR's CURRENT head both match the commit of the triggering run;
#   4. re-renders the card from the validated data (card.md is never posted),
#      upserts one comment and sets a `numguard: pass|fail|error` label.
name: numguard comment

on:
  workflow_call:
    inputs:
      numguard-ref:
        description: Tag or commit SHA of numguard to install (keep it equal to the @ref of this workflow).
        type: string
        default: v1.1.0
      numguard-repository:
        description: Repository numguard is installed from.
        type: string
        default: bhaskargurram-ai/numguard
      python-version:
        type: string
        default: "3.12"
      labels:
        description: "Set a `numguard: pass|fail|error` label (created if missing)."
        type: boolean
        default: true
      pr-number:
        description: >-
          Trusted PR number, e.g. from a job output of a job that ran no PR code. Default: read from the
          artifact (validated, and only accepted if that PR's head is the triggering run's commit).
        type: string
        default: ""
      artifact-run-id:
        description: "Run that uploaded `numguard-result`. Default: the triggering workflow_run."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  comment:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read          # download the artifact of the triggering run
      pull-requests: write   # upsert the comment and the status label
    steps:
      - name: Find the result artifact
        id: art
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.artifact-run-id || github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if ! [[ "$RUN_ID" =~ ^[0-9]{1,20}$ ]]; then echo "::error::invalid run id"; exit 1; fi
          n="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?name=numguard-result" --jq '.total_count')"
          if [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -gt 0 ]; then found=true; else found=false; fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "run-id=$RUN_ID" >> "$GITHUB_OUTPUT"
          [ "$found" = true ] || echo "No numguard-result artifact in run $RUN_ID; nothing to post."

      - name: Check out numguard (trusted tool source; never the pull request)
        if: steps.art.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.numguard-repository }}
          ref: ${{ inputs.numguard-ref }}
          path: .numguard-tool
          persist-credentials: false

      - uses: actions/setup-python@v5
        if: steps.art.outputs.found == 'true'
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install numguard (isolated virtualenv)
        if: steps.art.outputs.found == 'true'
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/numguard-venv"
          "$RUNNER_TEMP/numguard-venv/bin/python" -m pip install --quiet --disable-pip-version-check ./.numguard-tool
          echo "NUMGUARD_BIN=$RUNNER_TEMP/numguard-venv/bin/numguard" >> "$GITHUB_ENV"

      - name: Download result artifact
        if: steps.art.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: numguard-result
          path: ${{ runner.temp }}/numguard-artifact
          run-id: ${{ steps.art.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Validate PR number and head commit
        if: steps.art.outputs.found == 'true'
        id: pr
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/numguard-artifact
          INPUT_PR: ${{ inputs.pr-number }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_PR" ]; then
            pr="$INPUT_PR"
          else
            pr="$(head -c 20 "$ARTIFACT_DIR/pr_number" | tr -d '[:space:]')"
          fi
          if ! [[ "$pr" =~ ^[0-9]{1,10}$ ]]; then
            echo "::error::invalid PR number"; exit 1
          fi
          if ! [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::invalid head SHA of the triggering run"; exit 1
          fi
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          echo "head-sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      # `--expect-head-sha` makes the CLI refuse unless result.json AND the PR's
      # current head (read from the API) match the commit the triggering run tested.
      - name: Post or update the numguard card
        if: steps.art.outputs.found == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RESULT: ${{ runner.temp }}/numguard-artifact/result.json
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head-sha }}
          LABELS: ${{ inputs.labels }}
        run: |
          set -euo pipefail
          args=(comment --json "$RESULT" --pr "$PR_NUMBER" --expect-head-sha "$HEAD_SHA")
          if [ "$LABELS" = "true" ]; then args+=(--labels); fi
          "$NUMGUARD_BIN" "${args[@]}"
