# numguard suggested fixes (EXPERIMENTAL, opt-in).
#
# Dogfooding caller for the numguard repository itself. Other repositories
# should run `numguard init --agent` or copy examples/workflows/numguard-agent.yml.
#
# Runs from the default branch (`workflow_run`), with numguard installed from
# the default branch commit. It does nothing unless the repository has the
# NUMGUARD_LLM_API_KEY secret and the NUMGUARD_LLM_MODEL variable, a target
# fails, and numguard.toml sets `[agent] enabled = true`; by default only for
# PRs by owners/members/collaborators or labelled `numguard:agent`. See
# agent.yml for the three-job trust split.
name: numguard agent

on:
  workflow_run:
    workflows: ["numguard"]
    types: [completed]

permissions: {}

jobs:
  agent:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    permissions:
      contents: read
      actions: read
      pull-requests: read
    uses: ./.github/workflows/agent.yml
    with:
      numguard-repository: ${{ github.repository }}
      numguard-ref: ${{ github.sha }}
      llm-provider: ${{ vars.NUMGUARD_LLM_PROVIDER }}
      llm-model: ${{ vars.NUMGUARD_LLM_MODEL }}
      llm-base-url: ${{ vars.NUMGUARD_LLM_BASE_URL }}
      llm-reasoning-effort: ${{ vars.NUMGUARD_LLM_REASONING_EFFORT }}
      install-command: python -m pip install -e ".[dev]"
      run-for: trusted
    secrets:
      llm-api-key: ${{ secrets.NUMGUARD_LLM_API_KEY }}

  comment:
    needs: agent
    if: needs.agent.outputs.verified == 'true'
    permissions:
      contents: read
      actions: read
      pull-requests: write
    uses: ./.github/workflows/comment.yml
    with:
      numguard-repository: ${{ github.repository }}
      numguard-ref: ${{ github.sha }}
      pr-number: ${{ needs.agent.outputs.pr-number }}
      artifact-run-id: ${{ github.run_id }}
      labels: true
