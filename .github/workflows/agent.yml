# numguard reusable workflow: suggested fixes (EXPERIMENTAL, opt-in).
#
# Call it from a workflow triggered by `workflow_run` of the check workflow
# (see `numguard init --agent` or examples/workflows/numguard-agent.yml).
# When the check run found failing targets, an LLM proposes rewrites of the
# failing functions and numguard verifies each rewrite by running the checks.
#
# Three trust zones, one job each (separate jobs run on separate VMs, so code
# that runs in `verify` cannot read the key from `propose`'s memory or disk):
#
#   gate     no PR code, no checkout, no key. Reads the check artifact and the
#            GitHub API and decides whether the agent should run (`run-for`).
#   propose  holds the LLM key. Checks the PR out as DATA only: numguard reads
#            numguard.toml (TOML) and the failing functions' source (file
#            system + AST) and never installs, imports or executes the PR. The
#            model only gets read-only tools; its only output is a rewrite,
#            checked against a static denylist and written to a file.
#   verify   runs the PR's code and the model's rewrites against the checks.
#            No secrets are referenced, the token is read-only, no caches.
#
# The caller posts the card with comment.yml, passing the gate's `pr-number`
# output (trusted) and this run's id (see examples/workflows/numguard-agent.yml).
name: numguard agent

on:
  workflow_call:
    inputs:
      numguard-ref:
        description: Tag or commit SHA of numguard to install (keep it equal to the @ref of this workflow).
        type: string
        default: v1.1.0
      numguard-repository:
        description: Repository numguard is installed from.
        type: string
        default: bhaskargurram-ai/numguard
      python-version:
        type: string
        default: "3.12"
      install-command:
        description: Installs the project under test in the verify job (runs PR code there, never in propose).
        type: string
        default: 'pip install -e ".[dev]" || pip install -e .'
      config:
        description: Path of numguard.toml (read from the base commit when it exists there).
        type: string
        default: numguard.toml
      numguard-extras:
        description: Extras installed with numguard in the verify job.
        type: string
        default: scipy
      llm-provider:
        description: "anthropic | openai (any OpenAI-compatible endpoint)"
        type: string
        default: ""
      llm-model:
        description: Model id (required; there is no default model).
        type: string
        default: ""
      llm-base-url:
        description: Optional API base URL.
        type: string
        default: ""
      llm-reasoning-effort:
        description: >-
          Optional, OpenAI-compatible only: sent as reasoning_effort. GPT-6 Luna needs "none" to call tools
          through Chat Completions.
        type: string
        default: ""
      run-for:
        description: >-
          "trusted" (default): only PRs by OWNER/MEMBER/COLLABORATOR, or labelled `numguard:agent`.
          "everyone": any PR (spends API credits on any fork PR).
        type: string
        default: trusted
      label:
        description: Label that opts a PR in when run-for is "trusted".
        type: string
        default: "numguard:agent"
      timeout-minutes:
        description: Timeout of the verify job.
        type: number
        default: 30
    secrets:
      llm-api-key:
        description: API key for the LLM provider. Only the propose job sees it.
        required: false
    outputs:
      pr-number:
        description: PR number determined by the gate job from the API (trusted).
        value: ${{ jobs.gate.outputs.pr-number }}
      verified:
        description: "'true' when the verify job uploaded a `numguard-result` artifact in this run."
        value: ${{ jobs.verify.outputs.done }}

permissions:
  contents: read

jobs:
  gate:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read          # download the check artifact of the triggering run
      pull-requests: read    # PR head, base, labels, author association
    outputs:
      run: ${{ steps.decide.outputs.run }}
      pr-number: ${{ steps.decide.outputs.pr-number }}
      head-sha: ${{ steps.decide.outputs.head-sha }}
      base-sha: ${{ steps.decide.outputs.base-sha }}
    steps:
      - name: Find the check artifact
        id: art
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          n="$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?name=numguard-result" --jq '.total_count')"
          if [[ "$n" =~ ^[0-9]+$ ]] && [ "$n" -gt 0 ]; then echo "found=true" >> "$GITHUB_OUTPUT"; else echo "found=false" >> "$GITHUB_OUTPUT"; fi

      - name: Download the check artifact
        if: steps.art.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: numguard-result
          path: ${{ runner.temp }}/check
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Decide whether the agent runs
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ART: ${{ runner.temp }}/check
          FOUND: ${{ steps.art.outputs.found }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HAS_KEY: ${{ secrets.llm-api-key != '' }}
          HAS_MODEL: ${{ inputs.llm-model != '' }}
          RUN_FOR: ${{ inputs.run-for }}
          LABEL: ${{ inputs.label }}
        run: |
          set -euo pipefail
          skip() { echo "numguard agent: skipped ($1)" | tee -a "$GITHUB_STEP_SUMMARY"; echo "::notice title=numguard agent::skipped: $1"; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "$HAS_KEY" = "true" ] || skip "no llm-api-key secret configured"
          [ "$HAS_MODEL" = "true" ] || skip "no llm-model configured"
          if [ "$FOUND" != "true" ] || [ ! -f "$ART/result.json" ]; then skip "the check run produced no result"; fi
          [ "$(stat -c %s "$ART/result.json")" -le 5000000 ] || skip "result.json is too large"
          pr="$(head -c 20 "$ART/pr_number" 2>/dev/null | tr -d '[:space:]' || true)"
          [[ "$pr" =~ ^[0-9]{1,10}$ ]] || skip "the artifact has no valid PR number"
          # Trusted data from here on: the API, checked against the triggering run's commit.
          gh api "repos/$REPO/pulls/$pr" > "$RUNNER_TEMP/pr.json"
          head_sha="$(jq -r '.head.sha' "$RUNNER_TEMP/pr.json")"
          base_sha="$(jq -r '.base.sha' "$RUNNER_TEMP/pr.json")"
          state="$(jq -r '.state' "$RUNNER_TEMP/pr.json")"
          assoc="$(jq -r '.author_association' "$RUNNER_TEMP/pr.json")"
          labelled="$(jq -r --arg l "$LABEL" '[.labels[].name] | index($l) != null' "$RUNNER_TEMP/pr.json")"
          [ "$head_sha" = "$RUN_HEAD_SHA" ] || skip "PR #$pr is not at the checked commit (updated, or the artifact names another PR)"
          [ "$state" = "open" ] || skip "PR #$pr is not open"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || skip "unexpected base SHA"
          need="$(python3 -I -c '
          import json, sys
          try:
              targets = json.load(open(sys.argv[1], encoding="utf-8")).get("targets") or []
          except Exception:
              targets = []
          print("needed" if any(isinstance(t, dict) and t.get("status") == "fail" for t in targets) else "no-failing-targets")
          ' "$ART/result.json")"
          [ "$need" = "needed" ] || skip "$need"
          case "$assoc" in OWNER|MEMBER|COLLABORATOR) trusted=true ;; *) trusted=false ;; esac
          if [ "$RUN_FOR" != "everyone" ] && [ "$trusted" != "true" ] && [ "$labelled" != "true" ]; then
            skip "author is $assoc; a maintainer can add the '$LABEL' label to opt this PR in"
          fi
          {
            echo "run=true"
            echo "pr-number=$pr"
            echo "head-sha=$head_sha"
            echo "base-sha=$base_sha"
          } >> "$GITHUB_OUTPUT"
          echo "numguard agent: running for PR #$pr at ${head_sha:0:12}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Hand the check result to the next jobs
        if: steps.decide.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: numguard-check
          path: ${{ runner.temp }}/check/result.json
          retention-days: 1

  propose:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      has-candidates: ${{ steps.propose.outputs.has-candidates }}
    steps:
      # DATA ONLY: nothing in this checkout is installed, imported or executed.
      # It lives in pr/ and every output is written outside it.
      - name: Check out the pull request as data
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head-sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Check out numguard (trusted tool source)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.numguard-repository }}
          ref: ${{ inputs.numguard-ref }}
          path: .numguard-tool
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install numguard (isolated virtualenv; never the PR)
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/numguard-venv"
          "$RUNNER_TEMP/numguard-venv/bin/python" -m pip install --quiet --disable-pip-version-check ./.numguard-tool
          echo "NUMGUARD_BIN=$RUNNER_TEMP/numguard-venv/bin/numguard" >> "$GITHUB_ENV"
          echo "NG_OUT=$RUNNER_TEMP/numguard-out" >> "$GITHUB_ENV"

      - name: Download the check result
        uses: actions/download-artifact@v4
        with:
          name: numguard-check
          path: ${{ runner.temp }}/numguard-out

      - name: Select the configuration (base commit first; read as TOML data)
        env:
          BASE_SHA: ${{ needs.gate.outputs.base-sha }}
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          case "$CONFIG" in /*|*..*) echo "::error::config must be a relative path"; exit 1 ;; esac
          if git -C pr cat-file -e "$BASE_SHA:$CONFIG" 2>/dev/null; then
            git -C pr show "$BASE_SHA:$CONFIG" > "$NG_OUT/numguard.toml"
          else
            cp "pr/$CONFIG" "$NG_OUT/numguard.toml"
          fi
          echo "NG_ROOT=$GITHUB_WORKSPACE/pr/$(dirname "$CONFIG")" >> "$GITHUB_ENV"

      - name: Propose rewrites (LLM; read-only tools; runs no PR code)
        id: propose
        env:
          NUMGUARD_LLM_PROVIDER: ${{ inputs.llm-provider }}
          NUMGUARD_LLM_MODEL: ${{ inputs.llm-model }}
          NUMGUARD_LLM_BASE_URL: ${{ inputs.llm-base-url }}
          NUMGUARD_LLM_REASONING_EFFORT: ${{ inputs.llm-reasoning-effort }}
          NUMGUARD_LLM_API_KEY: ${{ secrets.llm-api-key }}
        run: |
          set -euo pipefail
          "$NUMGUARD_BIN" agent propose --config "$NG_OUT/numguard.toml" --result "$NG_OUT/result.json" \
            --repo "$NG_ROOT" --out-dir "$NG_OUT/candidates"
          if [ -f "$NG_OUT/candidates/manifest.json" ]; then echo "has-candidates=true" >> "$GITHUB_OUTPUT"; fi

      - name: Upload candidates
        if: steps.propose.outputs.has-candidates == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: numguard-candidates
          path: ${{ runner.temp }}/numguard-out/candidates
          retention-days: 7

  verify:
    needs: [gate, propose]
    if: needs.gate.outputs.run == 'true' && needs.propose.outputs.has-candidates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # No secrets are referenced in this job, the token is read-only, and no
    # caches are used (a poisoned cache could leak into trusted jobs).
    permissions:
      contents: read
    outputs:
      done: ${{ steps.verify.outputs.done }}
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out numguard (trusted tool source)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.numguard-repository }}
          ref: ${{ inputs.numguard-ref }}
          path: .numguard-tool
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install numguard (trusted source, before any PR code)
        env:
          EXTRAS: ${{ inputs.numguard-extras }}
        run: |
          set -euo pipefail
          spec="./.numguard-tool"
          if [[ "$EXTRAS" =~ ^[a-z0-9,_-]+$ ]]; then spec="./.numguard-tool[$EXTRAS]"; fi
          python -m pip install --quiet --disable-pip-version-check "$spec"
          mv .numguard-tool "$RUNNER_TEMP/numguard-tool"
          echo "NG_OUT=$RUNNER_TEMP/numguard-out" >> "$GITHUB_ENV"

      - name: Download the check result
        uses: actions/download-artifact@v4
        with:
          name: numguard-check
          path: ${{ runner.temp }}/numguard-out

      - name: Download candidates
        uses: actions/download-artifact@v4
        with:
          name: numguard-candidates
          path: ${{ runner.temp }}/numguard-out/candidates

      - name: Select the configuration (base commit first)
        env:
          BASE_SHA: ${{ needs.gate.outputs.base-sha }}
          CONFIG: ${{ inputs.config }}
        run: |
          set -euo pipefail
          case "$CONFIG" in /*|*..*) echo "::error::config must be a relative path"; exit 1 ;; esac
          if git cat-file -e "$BASE_SHA:$CONFIG" 2>/dev/null; then
            git show "$BASE_SHA:$CONFIG" > "$NG_OUT/numguard.toml"
          else
            cp "$CONFIG" "$NG_OUT/numguard.toml"
          fi
          echo "NG_ROOT=$GITHUB_WORKSPACE/$(dirname "$CONFIG")" >> "$GITHUB_ENV"

      - name: Install the project under test (runs PR code)
        env:
          INSTALL_COMMAND: ${{ inputs.install-command }}
        run: |
          set -euo pipefail
          eval "$INSTALL_COMMAND"

      - name: Verify the rewrites (runs PR code and model-written code; no LLM, no key)
        id: verify
        env:
          PR_NUMBER: ${{ needs.gate.outputs.pr-number }}
          HEAD_SHA: ${{ needs.gate.outputs.head-sha }}
        run: |
          set -euo pipefail
          python -m numguard agent verify --candidates "$NG_OUT/candidates" --config "$NG_OUT/numguard.toml" \
            --result "$NG_OUT/result.json" --repo "$NG_ROOT" \
            --json-out "$NG_OUT/result.json" --card-out "$NG_OUT/card.md"
          echo "$PR_NUMBER" > "$NG_OUT/pr_number"
          echo "$HEAD_SHA" > "$NG_OUT/head_sha"
          echo "done=true" >> "$GITHUB_OUTPUT"

      - name: Write the card to the job summary
        if: always() && steps.verify.outputs.done == 'true'
        run: python -m numguard summary --json "$NG_OUT/result.json"

      - name: Upload result
        if: steps.verify.outputs.done == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: numguard-result
          path: |
            ${{ runner.temp }}/numguard-out/result.json
            ${{ runner.temp }}/numguard-out/card.md
            ${{ runner.temp }}/numguard-out/pr_number
            ${{ runner.temp }}/numguard-out/head_sha
          retention-days: 7
