name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests (pytest)
        run: pytest -v
      - name: Unit tests (unittest, no pytest needed)
        run: python -m unittest discover -s tests
      - name: Eval - reference implementations must pass
        run: numguard eval --baseline reference --json-out reference-results.json
      - name: Eval - every buggy implementation must be detected
        run: numguard eval --baseline buggy --json-out buggy-results.json
      - name: CLI smoke test
        run: python -m numguard --help
