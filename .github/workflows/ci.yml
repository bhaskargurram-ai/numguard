name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests (pytest)
        run: python -m pytest -q
      - name: Unit tests (unittest, no pytest needed)
        run: python -m unittest discover -s tests
      - name: Eval - reference implementations must pass
        run: numguard eval --baseline reference --json-out reference-results.json
      - name: Eval - every buggy implementation must be detected
        run: numguard eval --baseline buggy --json-out buggy-results.json
      - name: Dogfood - numguard.toml (corpus references) must pass
        run: numguard check --config numguard.toml
      - name: CLI smoke test
        run: python -m numguard --help

  # The backend adapters and gradient checks against the real libraries
  # (CPU builds of JAX and PyTorch), not only the fakes in tests/fake_backends.py.
  backends:
    runs-on: ubuntu-latest
    env:
      JAX_ENABLE_X64: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install numguard with JAX and PyTorch (CPU)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,bfloat16]" "jax[cpu]"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -c "import jax, torch; print('jax', jax.__version__, 'torch', torch.__version__)"
      # tests/test_backends.py swaps fake torch/jax modules in and out of
      # sys.modules, which a real PyTorch installation cannot survive; it runs
      # in the test job, where neither library is installed.
      - name: Gradient and isolation tests on real JAX and PyTorch
        run: python -m pytest -q -rs tests/test_isolation_grad.py --junitxml=backend-junit.xml
      - name: Scan smoke test on JAX
        run: |
          numguard scan jax.scipy.special --ref scipy.special --backend jax \
            --include '^(expit|logit|erf|gammaln)$' --json-out jax-scan.json
          python -c "import json; d = json.load(open('jax-scan.json')); assert d['n_checked'] == 4, d"
      - name: Report failures as annotations
        if: failure()
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          for case in ET.parse("backend-junit.xml").iter("testcase"):
              for tag in ("failure", "error"):
                  el = case.find(tag)
                  if el is not None:
                      text = ((el.get("message") or "") + "\n" + (el.text or "")[-1500:]).strip()
                      text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title={case.get('name')}::{text}")
          EOF

  # The same unit tests on macOS and Windows (one Python version each).
  test-os:
    name: test (${{ matrix.os }}, 3.12)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests (pytest)
        run: python -m pytest -q --junitxml=junit.xml
      - name: Report failures as annotations
        if: failure()
        shell: bash
        run: |
          python - <<'EOF'
          import os, xml.etree.ElementTree as ET
          if not os.path.exists("junit.xml"):
              raise SystemExit(0)
          for case in ET.parse("junit.xml").iter("testcase"):
              for tag in ("failure", "error"):
                  el = case.find(tag)
                  if el is not None:
                      text = ((el.get("message") or "") + "\n" + (el.text or "")[-1500:]).strip()
                      text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title={case.get('name')}::{text}")
          EOF

  # Build the distributions and use them the way a user would: install the
  # wheel into a fresh virtualenv (outside the checkout) and run the CLI,
  # `numguard init`, a config-driven check and the eval harness against it.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          set -euo pipefail
          python -m pip install --upgrade build twine
          python -m build --outdir "$RUNNER_TEMP/dist"
          ls -l "$RUNNER_TEMP/dist"
      - name: Check distribution metadata
        run: python -m twine check --strict "$RUNNER_TEMP"/dist/*
      - name: Check the sdist and wheel contents
        run: |
          set -euo pipefail
          tar tzf "$RUNNER_TEMP"/dist/*.tar.gz > "$RUNNER_TEMP/sdist.txt"
          for f in LICENSE README.md pyproject.toml src/numguard/cli.py src/numguard/carddata.py \
                   src/numguard/agent/worker.py corpus/logsumexp/task.md; do
            grep -q "/$f\$" "$RUNNER_TEMP/sdist.txt" || { echo "::error::sdist lacks $f"; exit 1; }
          done
          python -m zipfile -l "$RUNNER_TEMP"/dist/*.whl > "$RUNNER_TEMP/wheel.txt"
          for f in numguard/agent/worker.py numguard/_corpus/logsumexp/task.md numguard/_corpus/logsumexp/spec.py \
                   numguard/py.typed; do
            grep -q "$f" "$RUNNER_TEMP/wheel.txt" || { echo "::error::wheel lacks $f"; exit 1; }
          done
      - name: Install the wheel into a fresh virtualenv
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --disable-pip-version-check "$(ls "$RUNNER_TEMP"/dist/*.whl)[scipy]"
      - name: Smoke-test the installed CLI
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          ng="$RUNNER_TEMP/venv/bin/numguard"
          py="$RUNNER_TEMP/venv/bin/python"
          # The installed copy, not the checkout, must be the one that runs.
          "$py" -c 'import numguard, sys; p = numguard.__file__; print(p); sys.exit("site-packages" not in p)'
          "$ng" --help
          "$ng" --version
          "$ng" agent --help
          "$ng" cases > /dev/null
          "$ng" eval --baseline reference
          "$ng" eval --baseline buggy
          repo="$RUNNER_TEMP/init-repo"
          mkdir -p "$repo"
          "$ng" init --repo "$repo" --agent
          for f in .github/workflows/numguard.yml .github/workflows/numguard-comment.yml \
                   .github/workflows/numguard-agent.yml numguard.toml; do
            test -s "$repo/$f" || { echo "::error::init did not write $f"; exit 1; }
          done
          printf 'import numpy as np\n\ndef lse(x):\n    return np.log(np.sum(np.exp(x)))\n' > "$repo/ops.py"
          printf '[[target]]\nfunction = "ops:lse"\nreference = "special.logsumexp(x)"\n' >> "$repo/numguard.toml"
          status=0
          "$ng" check --config "$repo/numguard.toml" --json-out "$repo/result.json" --card-out "$repo/card.md" || status=$?
          test "$status" -eq 1 || { echo "::error::the naive logsumexp should fail (status $status)"; exit 1; }
          "$py" - "$repo" <<'PY'
          import json, pathlib, sys
          from numguard.carddata import parse_card_data
          from numguard.result import validate_result
          repo = pathlib.Path(sys.argv[1])
          result = validate_result(json.loads((repo / "result.json").read_text()))
          data = parse_card_data((repo / "card.md").read_text())
          print("status:", result["status"], "data block:", data["status"], data["targets"])
          assert result["status"] == "fail" and data["status"] == "fail"
          assert "finite" in result["targets"][0]["failed_checks"]
          PY

  pytest-numguard-package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and check the pytest-numguard metapackage
        working-directory: packages/pytest-numguard
        run: |
          set -euo pipefail
          python -m pip install --upgrade build twine
          python -m build --outdir "$RUNNER_TEMP/pn-dist"
          python -m twine check --strict "$RUNNER_TEMP"/pn-dist/*
