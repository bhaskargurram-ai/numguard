site_name: numguard
site_description: Numerical edge-case testing for array code
site_url: https://bhaskargurram-ai.github.io/numguard/docs/
repo_url: https://github.com/bhaskargurram-ai/numguard
repo_name: bhaskargurram-ai/numguard
edit_uri: edit/main/docs/guide/
docs_dir: docs/guide
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      toggle: {icon: material/weather-sunny, name: Light mode}
nav:
  - Home: index.md
  - Quick start: quickstart.md
  - Edge cases and checks: checks.md
  - Backends and gradients: backends.md
  - pytest plugin: pytest.md
  - Config file: config.md
  - Command line: cli.md
  - GitHub integration: github.md
  - GitHub workflows in detail: GITHUB.md
  - Hypothesis strategies: hypothesis.md
  - Bug corpus: corpus.md
  - Agent (experimental): agent.md
  - Agent in detail: AGENT.md
  - Security model: security.md
  - Comparison and FAQ: compare.md
  - Limitations and roadmap: limitations.md
  - Python API: api.md
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            heading_level: 3
            members_order: source
