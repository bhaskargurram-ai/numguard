<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-labelledby="t d">
  <title id="t">numguard fix: propose, verify in a sandbox, accept only if every check passes</title>
  <desc id="d">The experimental fix loop. It starts from a function whose checks fail. The model reads the source, the failure table and the spec through read-only tools and submits a rewrite with the same signature through a schema-checked submit tool; this step holds the API key and executes nothing. A static gate parses the rewrite, checks the signature and rejects imports of os, subprocess, socket, shutil, ctypes or importlib, eval, exec, __import__ and writing open calls. The rewrite then runs in a subprocess with a timeout and a scrubbed environment that has no secrets. It is accepted only if it passes every check the original failed, introduces no new failures, matches the reference (or the original on benign inputs) within tolerance, and keeps dtype and shape behaviour. Accepted rewrites are shown as a unified diff with a before and after table, and files change only with --apply. Otherwise the new failure table goes back to the model, for up to three rounds by default, after which numguard reports that no verified fix was found.</desc>
  <style>
    svg { --bg:#ffffff; --edge:#d3dae1; --ink:#1b2329; --muted:#5d6a74; --box:#f5f7f9; --arrow:#7f8b95;
          --teal:#0f6e7a; --pass:#1a7f37; --pass-bg:#e3f6e7; --warn:#9a6700; --warn-bg:#fff6d6;
          --fail:#c8322f; --fail-bg:#fdeceb; --violet:#7a4fc9; --violet-bg:#f4eefe; }
    @media (prefers-color-scheme: dark) {
      svg { --bg:#121a1f; --edge:#2f3b44; --ink:#e3eaee; --muted:#94a1aa; --box:#18232a; --arrow:#6e7c86;
            --teal:#48b8c4; --pass:#4cc26a; --pass-bg:#12301c; --warn:#d6a23a; --warn-bg:#33270d;
            --fail:#ff6f66; --fail-bg:#3a1716; --violet:#ab8af0; --violet-bg:#261d3d; }
    }
    text { font-family:-apple-system, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill:var(--ink); }
    .mono { font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .bg { fill:var(--bg); stroke:var(--edge); }
    .box { fill:var(--box); stroke:var(--edge); stroke-width:1.2; }
    .inner { fill:var(--bg); stroke:var(--edge); }
    .h { font-size:14.5px; font-weight:650; }
    .li { font-size:12px; fill:var(--muted); }
    .code { font-size:11.5px; fill:var(--ink); }
    .ff { fill:var(--fail); }
    .ok { fill:var(--pass); font-weight:700; }
    .okbox { fill:var(--pass-bg); stroke:var(--pass); stroke-width:1.2; }
    .warnbox { fill:var(--warn-bg); stroke:var(--warn); stroke-width:1.2; }
    .okh { fill:var(--pass); font-size:14px; font-weight:700; }
    .warnh { fill:var(--warn); font-size:14px; font-weight:700; }
    .okl { fill:var(--ink); font-size:12px; }
    .wire { fill:none; stroke:var(--arrow); stroke-width:1.6; }
    .head { fill:var(--arrow); }
    .loop { fill:none; stroke:var(--violet); stroke-width:1.4; stroke-dasharray:5 4; }
    .vhead { fill:var(--violet); }
    .pill { fill:var(--bg); stroke:var(--violet); }
    .pt { font-size:11.5px; fill:var(--violet); font-weight:600; }
    .brk { fill:none; stroke:var(--muted); stroke-width:1.2; }
    .bt { font-size:12.5px; fill:var(--ink); }
    .btm { font-size:12.5px; fill:var(--muted); }
    .sand { fill:none; stroke:var(--teal); stroke-width:1.4; stroke-dasharray:6 4; }
    .sandt { font-size:11.5px; fill:var(--teal); font-weight:650; }
  </style>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="varr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="vhead" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="999" height="379" rx="14"/>

  <!-- refinement loop -->
  <polyline class="loop" points="880,266 880,296 236,296 236,276" marker-end="url(#varr)"/>
  <rect class="pill" x="410" y="285" width="300" height="22" rx="11"/>
  <text class="pt" x="560" y="300" text-anchor="middle">new failure table fed back, up to --rounds (3)</text>

  <!-- 1 failing function -->
  <rect class="box" x="20" y="40" width="140" height="226" rx="10"/>
  <text class="h" x="34" y="66">Failing checks</text>
  <text class="li" x="34" y="90">the original's report:</text>
  <rect class="inner" x="30" y="102" width="120" height="96" rx="6"/>
  <text class="code mono" x="40" y="122"><tspan class="ff">finite</tspan></text>
  <text class="code mono" x="52" y="140">huge, large</text>
  <text class="code mono" x="40" y="162"><tspan class="ff">reference</tspan></text>
  <text class="code mono" x="52" y="180">cancellation</text>
  <text class="li" x="34" y="226">plus the spec and</text>
  <text class="li" x="34" y="244">its reference</text>

  <path class="wire" d="M160 153 L 176 153" marker-end="url(#arr)"/>

  <!-- 2 propose -->
  <rect class="box" x="180" y="40" width="166" height="226" rx="10"/>
  <text class="h" x="194" y="66">Propose</text>
  <text class="li" x="194" y="90">LLM with read-only tools:</text>
  <text class="code" x="194" y="114">function source</text>
  <text class="code" x="194" y="134">failure table</text>
  <text class="code" x="194" y="154">spec and reference</text>
  <text class="li" x="194" y="186">only output: a schema-</text>
  <text class="li" x="194" y="204">checked submit call with</text>
  <text class="li" x="194" y="222">a same-signature rewrite</text>

  <path class="wire" d="M346 153 L 362 153" marker-end="url(#arr)"/>

  <!-- 3 static gate -->
  <rect class="box" x="366" y="40" width="160" height="226" rx="10"/>
  <text class="h" x="380" y="66">Static gate</text>
  <text class="li" x="380" y="90">parses, same signature</text>
  <text class="li" x="380" y="114">rejects imports of</text>
  <text class="code mono" x="380" y="134">os subprocess</text>
  <text class="code mono" x="380" y="152">socket shutil</text>
  <text class="code mono" x="380" y="170">ctypes importlib</text>
  <text class="li" x="380" y="194">and calls to</text>
  <text class="code mono" x="380" y="214">eval exec</text>
  <text class="code mono" x="380" y="232">__import__ open(w)</text>

  <path class="wire" d="M526 153 L 556 153" marker-end="url(#arr)"/>

  <!-- 4 sandboxed verify -->
  <rect class="sand" x="546" y="24" width="270" height="256" rx="12"/>
  <text class="sandt" x="560" y="18">subprocess, timeout, scrubbed env, no key</text>
  <rect class="box" x="560" y="40" width="242" height="226" rx="10"/>
  <text class="h" x="574" y="66">Verify by running the checks</text>
  <text class="li" x="574" y="90">accepted only if all hold:</text>
  <text class="okl" x="574" y="116"><tspan class="ok">✓</tspan> passes every check the</text>
  <text class="okl" x="588" y="134">original failed</text>
  <text class="okl" x="574" y="158"><tspan class="ok">✓</tspan> no new failures</text>
  <text class="okl" x="574" y="182"><tspan class="ok">✓</tspan> matches the reference, or</text>
  <text class="okl" x="588" y="200">the original on benign inputs</text>
  <text class="okl" x="574" y="224"><tspan class="ok">✓</tspan> same dtype and shape</text>
  <text class="okl" x="588" y="242">behaviour</text>

  <!-- fork -->
  <path class="wire" d="M802 153 C 812 153, 810 96, 820 96" marker-end="url(#arr)"/>
  <path class="wire" d="M802 153 C 812 153, 810 206, 820 206" marker-end="url(#arr)"/>

  <!-- 5 outcomes -->
  <rect class="okbox" x="824" y="40" width="156" height="112" rx="10"/>
  <text class="okh" x="838" y="66">verified fix</text>
  <text class="okl" x="838" y="90">unified diff and a</text>
  <text class="okl" x="838" y="108">before/after table;</text>
  <text class="okl" x="838" y="126">files change only</text>
  <text class="okl" x="838" y="144">with <tspan class="mono">--apply</tspan></text>

  <rect class="warnbox" x="824" y="162" width="156" height="104" rx="10"/>
  <text class="warnh" x="838" y="188">any check fails</text>
  <text class="okl" x="838" y="212">try another round;</text>
  <text class="okl" x="838" y="230">after the last one:</text>
  <text class="okl" x="838" y="248">"no verified fix"</text>

  <!-- job brackets -->
  <polyline class="brk" points="180,320 180,328 526,328 526,320"/>
  <text class="bt" x="353" y="352" text-anchor="middle"><tspan font-weight="650">propose</tspan><tspan class="btm">: holds the API key, executes nothing</tspan></text>
  <polyline class="brk" points="546,320 546,328 980,328 980,320"/>
  <text class="bt" x="763" y="352" text-anchor="middle"><tspan font-weight="650">verify</tspan><tspan class="btm">: executes the rewrite, holds no secrets</tspan></text>
</svg>
